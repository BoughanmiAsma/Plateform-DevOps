spring.application.name=devops_platform
server.port=8080
server.error.include-message=always

# H2 DATABASE
spring.datasource.url=jdbc:h2:file:./data/devopsdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# jenkins config
jenkins.base-url=http://localhost:8085
jenkins.username=Asma-Boughanmi
jenkins.api-token=1172572b454afc2a329f7728c663271a84

# ACTUATOR & PROMETHEUS
management.endpoints.web.exposure.include=health,prometheus,info
management.endpoint.prometheus.enabled=true
management.metrics.export.prometheus.enabled=true